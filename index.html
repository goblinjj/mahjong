<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>麻将听牌分析器 - 推倒胡 / 红中百搭</title>
  <meta name="description" content="拍照或手动输入麻将牌，智能分析听牌和最优出牌">

  <!-- PWA：装到主屏后 iOS 才会豁免约 7 天的存储清理策略，
       12MB 模型才能真正长期留在本地(详见 js/model-store.js) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a1a10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="麻将分析">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" href="/assets/icons/icon-192.png" type="image/png">

  <!-- 不引入 Google Fonts：大陆访问不到，而 <link rel=stylesheet> 是渲染阻塞的，
       会让首屏白屏直到连接超时。改用系统中文字体栈(见 css 的 --font-family)，
       iOS 的苹方 / Android 的思源黑体本身就是最佳选择，还省掉一次外部请求。 -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- ONNX Runtime Web：自托管，不走 cdn.jsdelivr.net。
       jsdelivr 在中国大陆访问不稳定，一旦拉不到，拍照识别功能会完全不可用。
       目录名带版本号，升级时改路径即可让缓存自然失效(见 _headers 的 immutable)。
       升级 ORT 时需同步替换 assets/vendor/ 下的三个文件并更新这里的路径。 -->
  <script src="/assets/vendor/onnxruntime-web@1.19.2/ort.min.js"></script>
  <script>
    // wasm 二进制与 ort.min.js 放在同一目录
    if (window.ort && ort.env && ort.env.wasm) {
      ort.env.wasm.wasmPaths = '/assets/vendor/onnxruntime-web@1.19.2/';
      // 单线程 WASM: 不需要 SharedArrayBuffer / COOP/COEP，兼容性最好
      ort.env.wasm.numThreads = 1;
    }

    // 注册 Service Worker（放在这里而非 app.js，确保独立于应用逻辑尽早执行）
    //
    // 开发服务器(Vite)下跳过：Vite 会把 CSS/JS 转成带 HMR 的模块，被 SW 缓存后
    // 会和热更新互相干扰。要在本地验证 PWA/离线能力，用 `npm run preview:pages`
    // (wrangler pages dev，真实静态服务，行为与线上一致)。
    (function () {
      var isDevServer = !!document.querySelector('script[src="/@vite/client"]');
      if ('serviceWorker' in navigator && !isDevServer) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.warn('Service Worker 注册失败:', err);
          });
        });
      }
    })();
  </script>
</head>
<body>
  <!-- Header -->
  <header id="app-header">
    <h1>🀄 麻将听牌分析器</h1>
    <p class="subtitle">推倒胡 · 红中百搭</p>
  </header>

  <main id="app-main">
    <!-- Input mode toggle -->
    <div id="input-mode-toggle" class="glass-panel">
      <button id="btn-manual" class="mode-btn active" aria-pressed="true" aria-label="手动选牌模式">🎯 手动选牌</button>
      <button id="btn-camera" class="mode-btn" aria-pressed="false" aria-label="拍照识别模式">📷 拍照识别</button>
    </div>

    <!-- Camera section (hidden by default) -->
    <section id="camera-section" class="hidden" aria-label="拍照识别区域">
      <!-- 模型状态条 -->
      <div id="model-status" class="model-status" role="status" aria-live="polite">
        <span class="model-status-icon" aria-hidden="true">⏳</span>
        <span class="model-status-text">正在加载识别模型...</span>
      </div>

      <div id="camera-container">
        <div id="camera-frame">
          <video id="camera-video" autoplay playsinline muted aria-label="摄像头预览"></video>
          <canvas id="camera-overlay" aria-hidden="true"></canvas>
        </div>
        <canvas id="camera-canvas" aria-hidden="true"></canvas>
        <div id="live-count-badge" aria-live="polite">初始化中…</div>
      </div>
      <div id="camera-controls">
        <button id="btn-confirm" class="action-btn primary" disabled aria-label="确认识别结果">✔ 确认识别结果</button>
      </div>

      <!-- 识别结果预览与修正 -->
      <div id="detection-preview" class="hidden glass-panel">
        <div class="section-header">
          <h2>识别结果</h2>
          <span id="detection-count" class="badge">0 张</span>
        </div>
        <div id="detection-canvas-wrap">
          <canvas id="detection-canvas" aria-label="识别结果标注图"></canvas>
        </div>
        <p class="detection-hint">点击下方牌可删除误检；确认无误后点【应用到手牌】。</p>
        <div id="detection-list" class="tile-row" role="list" aria-label="识别到的牌"></div>
        <div id="detection-actions">
          <button id="btn-detection-cancel" class="action-btn danger" aria-label="取消">取消</button>
          <button id="btn-detection-apply" class="action-btn primary" aria-label="应用到手牌">✔ 应用到手牌</button>
        </div>
      </div>
    </section>

    <!-- Manual tile selector section -->
    <section id="selector-section" aria-label="手动选牌区域">
      <div id="tile-selector" class="glass-panel"></div>
    </section>

    <!-- Current hand display -->
    <section id="hand-section" class="glass-panel" aria-label="当前手牌">
      <div class="section-header">
        <h2>你的手牌</h2>
        <span id="hand-count" class="badge" aria-live="polite">0/14</span>
      </div>
      <div id="hand-tiles" class="tile-row" role="list" aria-label="已选择的手牌"></div>
      <div id="hand-actions">
        <button id="btn-clear" class="action-btn danger" disabled aria-label="清空手牌">清空</button>
        <button id="btn-analyze" class="action-btn primary" disabled aria-label="分析听牌">🔍 分析听牌</button>
      </div>
    </section>

    <!-- Analysis results -->
    <section id="result-section" class="glass-panel hidden" aria-label="分析结果" aria-live="polite">
      <div class="section-header">
        <h2 id="result-title">分析结果</h2>
      </div>
      <div id="result-content"></div>
    </section>
  </main>

  <footer id="app-footer">
    <p>本地运算 · 数据不离开你的设备</p>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
