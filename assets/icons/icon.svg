<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- PWA 图标源文件。内容收在中心 ~62% 内，同时满足 maskable 安全区要求。
       用 npm run icons 生成各尺寸 PNG。 -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#12513a"/>
      <stop offset="100%" stop-color="#0a1a10"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f3e9"/>
      <stop offset="100%" stop-color="#ded4c2"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- 八条牌：88×120 原始比例，缩放 2.2727 后居中 -->
  <g transform="translate(156 113) scale(2.2727)">
