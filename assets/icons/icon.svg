    <rect x="1.2" y="1.2" width="85.6" height="117.6" rx="8" fill="none" stroke="#c8b89a" stroke-width="1.2" opacity="0.7"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
