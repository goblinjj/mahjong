      <path d="M22 20 L28 54 L44 30 L60 54 L66 20" stroke="#20a24b" stroke-width="6.5"/>
      <path d="M22 20 L28 54 L44 30 L60 54 L66 20" stroke="#5cc07f" stroke-width="2" opacity="0.55"/>
      <path d="M22 100 L28 66 L44 90 L60 66 L66 100" stroke="#0c5a24" stroke-width="11"/>
      <path d="M22 100 L28 66 L44 90 L60 66 L66 100" stroke="#20a24b" stroke-width="6.5"/>
      <path d="M22 100 L28 66 L44 90 L60 66 L66 100" stroke="#5cc07f" stroke-width="2" opacity="0.55"/>
    </g>
  </g>
